<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="max-width:480px;margin:40px auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:8px;padding:32px;">
    <div style="font-size:20px;font-weight:700;color:#111;">Sanchalan</div>
    <div style="font-size:13px;color:#666;margin-top:2px;">Event Command Center</div>
    <h2 style="font-size:16px;color:#111;margin:24px 0 8px;">Confirm your email</h2>
    <p style="font-size:14px;color:#444;line-height:1.6;">You're one step away from running your event with Sanchalan. Click below to confirm your email address:</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;margin:16px 0;padding:10px 24px;background:#111;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:500;">Confirm email address</a>
    <p style="font-size:12px;color:#888;margin-top:16px;">If you didn't sign up for Sanchalan, you can ignore this email.</p>
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid #eee;font-size:11px;color:#aaa;">
      Sanchalan · Notion is the system of record
    </div>
  </div>
</body>
</html>
